version: '3.8'

services:
  hornetz-drive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hornetz-drive
    ports:
      - "8061:8061"
    volumes:
      - hornetz_data:/data
    restart: unless-stopped
    environment:
      - PORT=:8061
      - STORAGE_DIR=/data/storage
      - DB_PATH=/data/metadata.db

volumes:
  hornetz_data:
